<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEM Branding – Hero Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #cc2a36;
  --black: #111111;
  --white: #ffffff;
}

body { font-family: 'DM Sans', sans-serif; background: #fff; overflow-x: hidden; }

/* ── HERO ── */
.iconic-hero-final {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: #ffffff;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.hero-bg-texture {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.055) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}

.hero-arc {
  position: absolute;
  left: -40px;
  top: 50%;
  transform: translateY(-55%);
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.1);
  pointer-events: none;
  z-index: 1;
  animation: arcSpin 18s linear infinite;
}
@keyframes arcSpin {
  from { transform: translateY(-55%) rotate(0deg); }
  to   { transform: translateY(-55%) rotate(360deg); }
}

.hero-arc-br {
  position: absolute;
  right: -80px;
  bottom: -80px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  border: 4px solid var(--red);
  clip-path: inset(0 50% 50% 0);
  pointer-events: none;
  z-index: 1;
}

/* ── VIDEO AREA (left side) ── */
.character-video-wrap {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 38%;
  max-width: 560px;
  z-index: 3;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transition: all 0.5s ease;
}

/* SINGLE VIDEO mode */
.character-video-wrap video {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

/* SPLIT VIDEO mode – two videos side by side */
.character-video-wrap.split-mode {
  width: 42%;
  flex-direction: row;
  align-items: flex-end;
  gap: 6px;
}
.character-video-wrap.split-mode video {
  width: 50%;
}

/* placeholder */
.char-placeholder {
  width: 100%;
  aspect-ratio: 3/4.2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: rgba(0,0,0,0.3);
  font-style: italic;
  padding: 20px;
  text-align: center;
  border: 2px dashed rgba(0,0,0,0.12);
  border-radius: 12px;
  margin: 30px;
}
.char-placeholder.half {
  width: 50%;
  aspect-ratio: 3/5;
  margin: 10px 4px;
}

/* ── CONTENT BOX ── */
.hero-content-box {
  position: relative;
  z-index: 4;
  margin-left: 36%;
  padding: 60px 60px 60px 40px;
  display: flex;
  flex-direction: column;
  gap: 44px;
  width: 64%;
}

/* ── TITLES ── */
.hero-titles { display: flex; flex-direction: column; gap: 0; }

/* For split mode: show two title stacks side by side */
.hero-titles.split-titles {
  flex-direction: row;
  gap: 32px;
  align-items: flex-start;
}
.title-group { display: flex; flex-direction: column; flex: 1; }

#dynamic-sub, .split-sub {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 3.8vw, 56px);
  color: var(--black);
  line-height: 1;
  letter-spacing: 2px;
  transition: opacity .35s ease, transform .35s ease;
}

#dynamic-main, .split-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(48px, 7.5vw, 110px);
  color: var(--red);
  line-height: 0.92;
  letter-spacing: 1px;
  position: relative;
  transition: opacity .35s ease, transform .35s ease;
}

#dynamic-main::before, .split-main::before {
  content: '';
  position: absolute;
  left: -24px; right: -24px;
  top: 4px; bottom: 4px;
  background: rgba(0,0,0,0.05);
  z-index: -1;
}

.title-fade-out { opacity: 0; transform: translateY(-8px); }

/* divider between split titles */
.split-title-divider {
  width: 1px;
  background: rgba(0,0,0,0.15);
  margin-top: 6px;
  align-self: stretch;
}

/* ── NAV WRAPPER ── */
.hero-nav-wrapper {
  display: flex;
  align-items: center;
  gap: 0;
  flex-wrap: nowrap;
}

.v-line {
  width: 1px;
  height: 56px;
  background: rgba(0,0,0,0.15);
  flex-shrink: 0;
}

/* ── NAV BUTTON ── */
.nav-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  transition: all .25s;
  text-align: left;
  flex-shrink: 0;
}
.nav-btn:hover .icon-circle { transform: scale(1.08); }

.icon-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .25s, transform .25s;
}
.nav-btn.active .icon-circle { background: var(--red); }
.icon-circle svg { display: block; }

.nav-btn p {
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 400;
  color: var(--black);
  line-height: 1.4;
}
.nav-btn p strong { font-weight: 700; display: block; }

/* auto-progress bar under active button */
.nav-btn::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--red);
  transition: width linear;
}
.nav-btn { position: relative; }
.nav-btn.running::after { width: 100%; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .character-video-wrap { width: 44%; }
  .hero-content-box { margin-left: 42%; width: 58%; padding: 36px 20px 36px 16px; }
  .nav-btn { padding: 8px 12px; gap: 9px; }
  .nav-btn p { font-size: 12px; }
}
@media (max-width: 640px) {
  .iconic-hero-final { flex-direction: column; min-height: auto; }
  .character-video-wrap { position: relative; width: 70%; margin: 0 auto; }
  .hero-content-box { margin-left: 0; width: 100%; padding: 20px 16px 36px; }
  .hero-arc { display: none; }
  .hero-nav-wrapper { flex-wrap: wrap; gap: 6px; }
  .v-line { display: none; }
  .hero-titles.split-titles { flex-direction: column; }
  .split-title-divider { display: none; }
  .character-video-wrap.split-mode { width: 90%; }
}
</style>
</head>
<body>

<section class="iconic-hero-final">
  <div class="hero-bg-texture"></div>
  <div class="hero-arc"></div>
  <div class="hero-arc-br"></div>

  <!-- VIDEO / CHARACTER AREA -->
  <div class="character-video-wrap" id="videoWrap">
    <!--
    ══════════════════════════════════════════════
    SINGLE VIDEO (buttons 1, 2, 3):
      Replace .char-placeholder with your <video>:

      <video id="main-hero-video" autoplay muted loop playsinline>
        <source src="./assets/images/banner/ear.mp4" type="video/mp4">
      </video>

    SPLIT VIDEO (button 4 – two videos):
      <video id="split-video-a" autoplay muted loop playsinline style="width:50%">
        <source src="./assets/images/banner/ear.mp4" type="video/mp4">
      </video>
      <video id="split-video-b" autoplay muted loop playsinline style="width:50%">
        <source src="./assets/images/banner/mouth.mp4" type="video/mp4">
      </video>
    ══════════════════════════════════════════════
    -->
    <div class="char-placeholder" id="singlePlaceholder">
      🎬 Single 3D character video here<br><small>ear.mp4 / eye.mp4 / mouth.mp4</small>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="hero-content-box">

    <!-- TITLE AREA — switches between single & split -->
    <div class="hero-titles" id="titlesWrap">
      <h2 id="dynamic-sub">ARTISANING ICONIC</h2>
      <h1 id="dynamic-main">IDENTITIES</h1>
    </div>

    <!-- 4 NAV BUTTONS -->
    <div class="hero-nav-wrapper">

      <!-- BTN 1: Ear -->
      <button class="nav-btn active" id="btn-0"
        data-sub="ARTISANING ICONIC" data-main="IDENTITIES"
        data-video="./assets/images/banner/ear.mp4" data-split="false">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24">
            <path d="M12 2a7 7 0 0 1 7 7c0 3.5-2.5 6.5-5 8v1a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-2.27A7 7 0 0 1 12 2zm0 2a5 5 0 0 0-3.46 8.54l.46.43V19h4v-1.5l.35-.28C15.5 15.5 17 13 17 9a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3 3 3 0 0 1-1.5 2.6V13h-3v-1.4A3 3 0 0 1 9 9a3 3 0 0 1 3-3z"/>
          </svg>
        </div>
        <p>Aligned to<br><strong>Your Brand</strong></p>
      </button>

      <div class="v-line"></div>

      <!-- BTN 2: Eye -->
      <button class="nav-btn" id="btn-1"
        data-sub="VISIONARY BRAND" data-main="STRATEGY"
        data-video="./assets/images/banner/eye.mp4" data-split="false">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </div>
        <p>Aimed at<br><strong>Your Future</strong></p>
      </button>

      <div class="v-line"></div>

      <!-- BTN 3: Mouth -->
      <button class="nav-btn" id="btn-2"
        data-sub="ARTICULATE GROWTH" data-main="SUCCESS"
        data-video="./assets/images/banner/mouth.mp4" data-split="false">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="white" opacity="0.18"/>
            <path d="M7 14.5C8.5 17 10.5 18 12 18s3.5-1 5-3.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="9" cy="10" r="1.2" fill="white"/>
            <circle cx="15" cy="10" r="1.2" fill="white"/>
          </svg>
        </div>
        <p>Articulate About<br><strong>Your Success</strong></p>
      </button>

      <div class="v-line"></div>

      <!-- BTN 4: SPLIT – shows BOTH ear+mouth video & BOTH titles -->
      <button class="nav-btn" id="btn-3"
        data-sub="ARTISANING ICONIC" data-main="IDENTITIES"
        data-sub2="ARTICULATE GROWTH" data-main2="SUCCESS"
        data-video="./assets/images/banner/ear.mp4"
        data-video2="./assets/images/banner/mouth.mp4"
        data-split="true">
        <div class="icon-circle">
          <!-- double-play / combine icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24">
            <rect x="3" y="5" width="7" height="14" rx="1.5" fill="white" opacity="0.9"/>
            <rect x="14" y="5" width="7" height="14" rx="1.5" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <p>Articulate About<br><strong>Your Success</strong></p>
      </button>

    </div><!-- /.hero-nav-wrapper -->
  </div><!-- /.hero-content-box -->
</section>

<script>
(function () {
  var buttons      = document.querySelectorAll('.nav-btn');
  var titlesWrap   = document.getElementById('titlesWrap');
  var videoWrap    = document.getElementById('videoWrap');
  var AUTO_DELAY   = 4000;   // ms per slide
  var autoTimer    = null;
  var currentIndex = 0;
  var isUserClick  = false;

  /* ── SWITCH SLIDE ── */
  function switchTo(index, fromUser) {
    if (fromUser) { isUserClick = true; clearInterval(autoTimer); }

    buttons.forEach(function(b){ b.classList.remove('active'); });
    buttons[index].classList.add('active');
    currentIndex = index;

    var btn    = buttons[index];
    var isSplit = btn.getAttribute('data-split') === 'true';

    /* fade titles out */
    var oldSubs  = titlesWrap.querySelectorAll('[id^="dynamic-sub"], .split-sub');
    var oldMains = titlesWrap.querySelectorAll('[id^="dynamic-main"], .split-main');
    [].concat([].slice.call(oldSubs), [].slice.call(oldMains)).forEach(function(el){
      el.classList.add('title-fade-out');
    });

    setTimeout(function() {
      if (isSplit) {
        /* ── SPLIT MODE ── */
        titlesWrap.className = 'hero-titles split-titles';
        titlesWrap.innerHTML =
          '<div class="title-group">' +
            '<h2 class="split-sub">' + btn.getAttribute('data-sub')  + '</h2>' +
            '<h1 class="split-main">' + btn.getAttribute('data-main') + '</h1>' +
          '</div>' +
          '<div class="split-title-divider"></div>' +
          '<div class="title-group">' +
            '<h2 class="split-sub">' + btn.getAttribute('data-sub2')  + '</h2>' +
            '<h1 class="split-main">' + btn.getAttribute('data-main2') + '</h1>' +
          '</div>';

        /* video wrap → split */
        videoWrap.className = 'character-video-wrap split-mode';
        videoWrap.innerHTML =
          buildVideoOrPlaceholder(btn.getAttribute('data-video'),  'video-a', 'half') +
          buildVideoOrPlaceholder(btn.getAttribute('data-video2'), 'video-b', 'half');

      } else {
        /* ── SINGLE MODE ── */
        titlesWrap.className = 'hero-titles';
        titlesWrap.innerHTML =
          '<h2 id="dynamic-sub">'  + btn.getAttribute('data-sub')  + '</h2>' +
          '<h1 id="dynamic-main">' + btn.getAttribute('data-main') + '</h1>';

        videoWrap.className = 'character-video-wrap';
        videoWrap.innerHTML = buildVideoOrPlaceholder(btn.getAttribute('data-video'), 'main-hero-video', '');
      }

      /* restart auto after user pauses */
      if (!isUserClick) startAuto();
    }, 220);
  }

  /* build a <video> tag (swap .char-placeholder for real <video> once you have assets) */
  function buildVideoOrPlaceholder(src, id, extraClass) {
    /*
      REAL VIDEO – uncomment when you have the files:
      return '<video id="' + id + '" class="' + extraClass + '" autoplay muted loop playsinline>' +
               '<source src="' + src + '" type="video/mp4">' +
             '</video>';
    */
    var label = src ? src.split('/').pop() : 'video';
    return '<div class="char-placeholder ' + extraClass + '">🎬 ' + label + '</div>';
  }

  /* ── AUTO ROTATE (buttons 0→1→2→3→0…) ── */
  function startAuto() {
    isUserClick = false;
    clearInterval(autoTimer);
    autoTimer = setInterval(function () {
      var next = (currentIndex + 1) % buttons.length;
      switchTo(next, false);
    }, AUTO_DELAY);
  }

  /* click handler */
  buttons.forEach(function (btn, i) {
    btn.addEventListener('click', function () { switchTo(i, true); });
  });

  /* init: show slide 0 then start auto */
  switchTo(0, false);
  startAuto();
})();
</script>

</body>
</html>
