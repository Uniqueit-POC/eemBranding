<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Slider</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== HERO BANNER ===== */
        .iconic-hero-final {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #fff;
            display: flex;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* ── Background texture ── */
        .hero-bg-texture {
            position: absolute;
            inset: 0;
            background: url('./assets/images/home/01-Home-Page-2560×1440-Background.png') center/cover;
            z-index: 1;
        }

        /* ── Character video ── */
        .character-video-wrap {
            position: absolute;
            left: 10%;
            bottom: 0;
            height: 95%;
            z-index: 2;
        }
        .character-video-wrap video {
            height: 100%;
            object-fit: contain;
        }

        /* ── Intro image (phase 0) ── */
        .hero-intro-image {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: url('./assets/images/banner/01-Home-Page-2560×1440.webp') center/cover no-repeat;
            /* Fallback solid color if image hasn't loaded yet */
            background-color: #111;
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        .hero-intro-image.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .hero-intro-image.hidden {
            display: none;
        }

        /* ── Content box ── */
        .hero-content-box {
            position: relative;
            z-index: 3;
            margin-left: 45%;
            width: 50%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .hero-content-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Titles ── */
        .hero-titles h2 {
            font-size: 3rem;
            font-weight: 800;
            color: #000;
            margin: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hero-titles h1 {
            font-size: 6rem;
            font-weight: 900;
            color: #e31e24;
            line-height: 0.8;
            margin: 10px 0 50px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hero-titles.slide-out h2,
        .hero-titles.slide-out h1 {
            opacity: 0;
            transform: translateY(-15px);
        }
        .hero-titles.slide-in h2,
        .hero-titles.slide-in h1 {
            opacity: 0;
            transform: translateY(15px);
        }
        .hero-titles.slide-in.active h2,
        .hero-titles.slide-in.active h1 {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Nav wrapper ── */
        .hero-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* ── Nav buttons ── */
        .nav-btn {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 10px;
            position: relative;
        }

        /* Progress bar under each button */
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10px;
            right: 10px;
            height: 3px;
            background: #e31e24;
            transform: scaleX(0);
            transform-origin: left;
            transition: none;
            border-radius: 2px;
        }
        .nav-btn.active::after {
            transform: scaleX(1);
            transition: transform var(--slide-duration, 3s) linear;
        }
        /* Stop progress on manual selection */
        .nav-btn.manual-active::after {
            transform: scaleX(1);
            transition: none;
        }

        .icon-circle {
            width: 55px;
            height: 55px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }
        .icon-circle img { width: 25px; filter: invert(1); }

        .nav-btn p {
            text-align: left;
            font-size: 15px;
            color: #555;
            line-height: 1.3;
            transition: color 0.3s ease;
        }

        .v-line {
            width: 1px;
            height: 50px;
            background: #ddd;
            flex-shrink: 0;
        }

        /* Active state */
        .nav-btn.active .icon-circle,
        .nav-btn.manual-active .icon-circle {
            background: #e31e24;
            box-shadow: 0 10px 20px rgba(227, 30, 36, 0.3);
        }
        .nav-btn.active p,
        .nav-btn.manual-active p {
            color: #000;
        }
    </style>
</head>
<body>

<!-- ===================== HERO BANNER ===================== -->
<section class="iconic-hero-final">

    <!-- Phase 0: Intro cover shown for 2 seconds (uses the same bg image, no content) -->
    <!-- To use a DIFFERENT intro image, change the background-image in .hero-intro-image CSS above -->
    <div class="hero-intro-image" id="hero-intro"></div>

    <!-- Background texture -->
    <div class="hero-bg-texture"></div>

    <!-- Character video (left side) -->
    <div class="character-video-wrap">
        <video id="main-hero-video" autoplay muted loop playsinline>
            <source src="./assets/images/banner/ear.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Content (right side) -->
    <div class="hero-content-box" id="hero-content">
        <div class="hero-titles" id="hero-titles">
            <h2 id="dynamic-sub">ARTISANING ICONIC</h2>
            <h1 id="dynamic-main">IDENTITIES</h1>
        </div>

        <div class="hero-nav-wrapper">

            <!-- Slide 1: Aligned to Your Brand -->
            <button class="nav-btn" data-index="0"
                    data-sub="ARTISANING ICONIC"
                    data-main="IDENTITIES"
                    data-video="./assets/images/banner/ear.mp4">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" viewBox="0 0 24 24">
                        <path d="M12 2a7 7 0 0 1 7 7c0 3.5-2.5 6.5-5 8v1a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-2.27A7 7 0 0 1 12 2zm0 2a5 5 0 0 0-3.46 8.54l.46.43V19h4v-1.5l.35-.28C15.5 15.5 17 13 17 9a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3 3 3 0 0 1-1.5 2.6V13h-3v-1.4A3 3 0 0 1 9 9a3 3 0 0 1 3-3z"/>
                    </svg>
                </div>
                <p>Aligned to<br><strong>Your Brand</strong></p>
            </button>

            <div class="v-line"></div>

            <!-- Slide 2: Aimed at Your Future -->
            <button class="nav-btn" data-index="1"
                    data-sub="VISIONARY BRAND"
                    data-main="STRATEGY"
                    data-video="./assets/images/banner/eye.mp4">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
                <p>Aimed at<br><strong>Your Future</strong></p>
            </button>

            <div class="v-line"></div>

            <!-- Slide 3: Articulate About Your Success -->
            <button class="nav-btn" data-index="2"
                    data-sub="ARTICULATE GROWTH"
                    data-main="SUCCESS"
                    data-video="./assets/images/banner/mouth.mp4">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                        <path d="M7 14.5C8.5 17 10.5 18 12 18s3.5-1 5-3.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <p>Articulate About<br><strong>Your Success</strong></p>
            </button>

        </div>
    </div>
</section>
<!-- ===================== HERO BANNER END ===================== -->

<script>
(function () {

    /* ── Config ── */
    var INTRO_DURATION   = 2000;   // ms – how long the intro image shows
    var SLIDE_DURATION   = 3000;   // ms – how long each slide shows before auto-advance
    var TRANSITION_MS    = 400;    // ms – title fade duration (must match CSS)

    /* ── Elements ── */
    var introEl    = document.getElementById('hero-intro');
    var contentBox = document.getElementById('hero-content');
    var titlesEl   = document.getElementById('hero-titles');
    var subEl      = document.getElementById('dynamic-sub');
    var mainEl     = document.getElementById('dynamic-main');
    var videoEl    = document.getElementById('main-hero-video');
    var buttons    = Array.from(document.querySelectorAll('.nav-btn'));

    /* ── State ── */
    var currentIndex  = 0;
    var autoTimer     = null;
    var isAuto        = true;   // flips to false when user manually clicks

    /* Pass CSS variable for the progress-bar animation duration */
    document.documentElement.style.setProperty('--slide-duration', (SLIDE_DURATION / 1000) + 's');

    /* ─────────────────────────────────────────
       Activate a slide (by index)
    ───────────────────────────────────────── */
    function activateSlide(index, manual) {
        var btn = buttons[index];
        if (!btn) return;

        /* 1. Update title with slide-out → slide-in animation */
        titlesEl.classList.add('slide-out');
        setTimeout(function () {
            subEl.textContent  = btn.getAttribute('data-sub');
            mainEl.textContent = btn.getAttribute('data-main');
            titlesEl.classList.remove('slide-out');
            titlesEl.classList.add('slide-in');
            /* tiny frame delay so browser registers the class change */
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    titlesEl.classList.add('active');
                });
            });
            setTimeout(function () {
                titlesEl.classList.remove('slide-in', 'active');
            }, TRANSITION_MS + 50);
        }, TRANSITION_MS);

        /* 2. Swap video */
        var newSrc = btn.getAttribute('data-video');
        var source = videoEl.querySelector('source');
        var currentFile = source.src.split('/').pop();
        var newFile     = newSrc.split('/').pop();
        if (currentFile !== newFile) {
            source.src = newSrc;
            videoEl.load();
            videoEl.play();
        }

        /* 3. Update active button states */
        buttons.forEach(function (b) {
            b.classList.remove('active', 'manual-active');
        });
        btn.classList.add(manual ? 'manual-active' : 'active');

        currentIndex = index;
    }

    /* ─────────────────────────────────────────
       Auto-advance loop
    ───────────────────────────────────────── */
    function scheduleNext() {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(function () {
            if (!isAuto) return;
            var next = (currentIndex + 1) % buttons.length;
            activateSlide(next, false);
            scheduleNext();
        }, SLIDE_DURATION);
    }

    /* ─────────────────────────────────────────
       Manual click handler
    ───────────────────────────────────────── */
    buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            var idx = parseInt(btn.getAttribute('data-index'), 10);
            isAuto = false;             // stop auto-cycling
            clearTimeout(autoTimer);    // cancel pending auto-advance
            activateSlide(idx, true);
        });
    });

    /* ─────────────────────────────────────────
       Sequence on page load
       Phase 0: show intro image (2 s)
       Phase 1: fade out intro, reveal content, start slider at slide 0
    ───────────────────────────────────────── */
    setTimeout(function () {

        /* Fade out the intro overlay */
        introEl.classList.add('fade-out');

        /* Reveal hero content */
        contentBox.classList.add('visible');

        /* Activate first slide (auto mode) */
        activateSlide(0, false);

        /* After fade transition remove intro from DOM flow */
        setTimeout(function () {
            introEl.classList.add('hidden');
        }, 850);

        /* Start the auto-advance loop (first advance after SLIDE_DURATION) */
        scheduleNext();

    }, INTRO_DURATION);

})();
</script>

</body>
</html>
