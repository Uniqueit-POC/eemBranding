<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Fix Slider</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
         /* ===== HERO BANNER ===== */
        .iconic-hero-final {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #fff;
            display: flex;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .hero-bg-texture {
            position: absolute;
            inset: 0;
            background: url('./assets/images/home/01-Home-Page-2560×1440-Background.png') center/cover;
            z-index: 1;
        }

        .character-video-wrap {
            position: absolute;
            left: 10%;
            bottom: 0;
            height: 95%;
            z-index: 2;
        }

        .character-video-wrap video {
            height: 100%;
            object-fit: contain;
        }

        .hero-content-box {
            position: relative;
            z-index: 3;
            margin-left: 45%;
            width: 50%;
        }

        .hero-titles h2 {
            font-size: 3rem;
            font-weight: 800;
            color: #000;
            margin: 0;
        }

        .hero-titles h1 {
            font-size: 6rem;
            font-weight: 900;
            color: #e31e24;
            line-height: 0.8;
            margin: 10px 0 50px;
        }

        .hero-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 10px;
        }

        .icon-circle {
            width: 55px;
            height: 55px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .icon-circle img {
            width: 25px;
            filter: invert(1);
        }

        .nav-btn p {
            text-align: left;
            font-size: 15px;
            color: #555;
            line-height: 1.3;
        }

        .v-line {
            width: 1px;
            height: 50px;
            background: #ddd;
        }

        .nav-btn.active .icon-circle {
            background: #e31e24;
            box-shadow: 0 10px 20px rgba(227, 30, 36, 0.3);
        }

        .nav-btn.active p {
            color: #000;
        }
    </style>
</head>
<body>

  <!-- Hero Banner -->
                    <section class="iconic-hero-final">
                        <div class="hero-bg-texture"></div>
                        <div class="character-video-wrap"> <video id="main-hero-video" autoplay muted loop playsinline>
                                <source src="./assets/images/banner/ear.mp4" type="video/mp4">
                            </video> </div>
                        <div class="hero-content-box">
                            <div class="hero-titles">
                                <h2 class="lg:text-[80px]/90 sm:text-5xl text-4xxl lg:mb-30 mb-10 text-white headline"
                                    id="dynamic-sub">ARTISANING ICONIC</h2>
                                <h1 class="headline" id="dynamic-main">IDENTITIES</h1>
                            </div>
                            <div class="hero-nav-wrapper"> <button class="nav-btn active" data-sub="ARTISANING ICONIC"
                                    data-main="IDENTITIES" data-video="./assets/images/banner/ear.mp4">
                                    <div class="icon-circle"><img src="assets/images/banner/ear.mp4" alt="Ear"
                                            style="display:none"><svg xmlns="http://www.w3.org/2000/svg" width="25"
                                            height="25" fill="white" viewBox="0 0 24 24">
                                            <path
                                                d="M12 2a7 7 0 0 1 7 7c0 3.5-2.5 6.5-5 8v1a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-2.27A7 7 0 0 1 12 2zm0 2a5 5 0 0 0-3.46 8.54l.46.43V19h4v-1.5l.35-.28C15.5 15.5 17 13 17 9a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3 3 3 0 0 1-1.5 2.6V13h-3v-1.4A3 3 0 0 1 9 9a3 3 0 0 1 3-3z" />
                                        </svg></div>
                                    <p id="label-1">Aligned to<br><strong>Your Brand</strong></p>
                                </button>
                                <div class="v-line"></div> <button class="nav-btn" data-sub="VISIONARY BRAND"
                                    data-main="STRATEGY" data-video="./assets/images/banner/eye.mp4">
                                    <div class="icon-circle"><svg xmlns="http://www.w3.org/2000/svg" width="25"
                                            height="25" fill="white" viewBox="0 0 24 24">
                                            <path
                                                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                                        </svg></div>
                                    <p id="label-2">Aimed at<br><strong>Your Future</strong></p>
                                </button>
                                <div class="v-line"></div> <button class="nav-btn" data-sub="ARTICULATE GROWTH"
                                    data-main="SUCCESS" data-video="./assets/images/banner/mouth.mp4">
                                    <div class="icon-circle"><svg xmlns="http://www.w3.org/2000/svg" width="25"
                                            height="25" fill="white" viewBox="0 0 24 24">
                                            <path
                                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" />
                                            <path d="M7 14.5C8.5 17 10.5 18 12 18s3.5-1 5-3.5" stroke="white"
                                                stroke-width="1.5" fill="none" stroke-linecap="round" />
                                        </svg></div>
                                    <p id="label-3">Articulate About<br><strong>Your Success</strong></p>
                                </button>
                            </div>
                        </div>
                    </section>
                    <!-- Hero Banner END -->

                    <script> (function () { var buttons = document.querySelectorAll('.nav-btn'); var mainVideo = document.getElementById('main-hero-video'); var subTitle = document.getElementById('dynamic-sub'); var mainTitle = document.getElementById('dynamic-main'); buttons.forEach(function (btn) { btn.addEventListener('click', function () { buttons.forEach(function (b) { b.classList.remove('active'); }); btn.classList.add('active'); subTitle.innerText = btn.getAttribute('data-sub'); mainTitle.innerText = btn.getAttribute('data-main'); var newVid = btn.getAttribute('data-video'); var source = mainVideo.querySelector('source'); if (source && !source.src.includes(newVid.split('/').pop())) { source.src = newVid; mainVideo.load(); mainVideo.play(); } }); }); })(); </script>
                    

</body>
</html>
